  description: > # Can be Markdown
    I am a software engineer working on radar perception and automotive
    security, based in Ulm, Germany.


    I studied mechatronics at Bonn-Rhein-Sieg University of Applied Sciences
    (Dipl.-Ing. (FH), 2010) and computational engineering at Leibniz University
    Hannover, where I graduated with honors in 2015 after a research semester at
    KTH Stockholm. I then joined the Institute of Measurement, Control and
    Microtechnology at Ulm University as a research associate. My doctoral
    research focused on low-level radar–camera fusion with self-supervised deep
    learning for reliable environment perception in adverse weather.


    Since late 2021 I have been working in industry on radar perception for
    automated driving. I took a probabilistic radar grid from a CPU prototype to
    a real-time CUDA implementation that now runs in series production vehicles,
    and co-developed a deep-learning model that detects obstacles and occupancy
    around the vehicle. Today I work on embedded and automotive security, from
    cryptographic key provisioning to secure vehicle communication and
    diagnostics.


    You can reach me by email at
    [c.ditzel@gmail.com](mailto:c.ditzel@gmail.com).
