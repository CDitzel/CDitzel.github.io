---
layout: base
description: Template for homepage
remark: See also page.layout == 'home' in head.html and jumbotron.html
---

<div class="row">
  <div class="col-md-10 col-lg-8 mx-auto">
    <div class="row">
      <div class="col">

        {{ content }}

      </div>
    </div>
    
  {% if site.posts_on_home > 0 %}
    <div class="row cards mt-4">
    {% for post in site.posts limit:site.posts_on_home %}
      <div class="col-md-6">
        {% include card.html %}
      </div>
    {% endfor %}
    </div>
  {% endif %}
</div>
